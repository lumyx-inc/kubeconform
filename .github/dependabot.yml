# Dependabot configuration for the lumyx-inc fork. PRs target this fork's
# origin, never upstream.
#
# Schedule: monthly, with a 7-day cooldown so a release has to survive a
# week in the wild before Dependabot offers it. Each ecosystem gets two
# grouped PRs per month: `monthly-batch` (minor + patch) and
# `monthly-majors` (major). Majors are split out because they are the
# bumps most likely to need a deliberate review. Security updates are
# not on this schedule -- they open as soon as an advisory lands.

version: 2
updates:
  # === Docker ===
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: [minor, patch]
      monthly-majors:
        patterns: ["*"]
        update-types: [major]

  # === GitHub Actions ===
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: [minor, patch]
      monthly-majors:
        patterns: ["*"]
        update-types: [major]

  # === gomod ===
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, gomod]
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: [minor, patch]
      monthly-majors:
        patterns: ["*"]
        update-types: [major]
